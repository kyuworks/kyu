name: Newest Hatchet engine

# CI runs the hatchet-lite tag infra/hatchet/compose.yaml pins; this runs the newest release
# against the same suites, to learn of a breaking engine before an upgrade. Not a pull-request check (REQUIRED.md).
on:
  schedule:
    - cron: '23 7 * * 3' # Wednesdays, 07:23 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Run even when the newest tag is the pinned one
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Read-only: no job here reads or writes the repository's Actions cache.
cache-mode: none

env:
  FORCE_COLOR: '1'

jobs:
  pick:
    name: Pick the engine tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.newest }}
      test: ${{ steps.pick.outputs.test }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
          build: 'false'
          cache: 'false'
      - name: Newest hatchet-lite release
        id: pick
        env:
          FORCE_RUN: ${{ inputs.force }}
        run: |
          if [ "${FORCE_RUN}" = "true" ]; then set -- --force; fi
          bash scripts/newest-hatchet-engine.sh "$@" > "${RUNNER_TEMP}/pick.txt"
          cat "${RUNNER_TEMP}/pick.txt" >> "${GITHUB_OUTPUT}"
          { echo '### Hatchet engine'; sed 's/^/- /' "${RUNNER_TEMP}/pick.txt"; } >> "${GITHUB_STEP_SUMMARY}"
      - name: Nothing new to test
        if: steps.pick.outputs.test == 'no'
        env:
          NEWEST: ${{ steps.pick.outputs.newest }}
        run: echo "The newest engine release is the pinned one (${NEWEST}). Nothing new to test." | tee -a "${GITHUB_STEP_SUMMARY}"

  test:
    name: Hatchet engine ${{ needs.pick.outputs.tag }} (${{ matrix.shard }}/2)
    needs: pick
    if: needs.pick.outputs.test == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2']
    env:
      KYU_TEST_DATABASE_URL: postgresql://hatchet:hatchet@localhost:5432/kyu_test
      KYU_TEST_POOLER_DATABASE_URL: postgresql://hatchet:hatchet@127.0.0.1:6432/kyu_test
      KYU_INTEGRATION_SHARD: ${{ matrix.shard }}
    # Same services as ci.yml's engine-services but the engine tag; change all three workflows together (ci.yml, newest-client.yml, this file).
    services:
      postgres:
        image: postgres:15.6
        env:
          POSTGRES_USER: hatchet
          POSTGRES_PASSWORD: hatchet
          POSTGRES_DB: hatchet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d hatchet -U hatchet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The tag check-engine-image-tag.sh lets this file, and only this file, choose at run time.
      hatchet-lite:
        image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:${{ needs.pick.outputs.tag }}
        env:
          DATABASE_URL: postgresql://hatchet:hatchet@postgres:5432/hatchet?sslmode=disable
          SERVER_AUTH_COOKIE_DOMAIN: localhost
          SERVER_AUTH_COOKIE_INSECURE: 't'
          SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
          SERVER_GRPC_INSECURE: 't'
          SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
          SERVER_GRPC_PORT: '7077'
          SERVER_URL: http://localhost:8888
          SERVER_AUTH_SET_EMAIL_VERIFIED: 't'
          SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
        ports:
          - 8888:8888
          - 7077:7077
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DB_HOST: postgres
          DB_USER: hatchet
          DB_PASSWORD: hatchet
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          LISTEN_PORT: '6432'
          MAX_PREPARED_STATEMENTS: '0'
          SERVER_IDLE_TIMEOUT: '10'
        ports:
          - 6432:6432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 6432 -U hatchet -d hatchet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build: 'true'
          cache: 'false'
      - name: Unit tests
        if: matrix.shard == '1'
        run: pnpm test
      - name: Wait for the engine
        env:
          ENGINE_TAG: ${{ needs.pick.outputs.tag }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8888/api/ready >/dev/null 2>&1; then
              version="$(curl -fsS --max-time 5 http://localhost:8888/api/v1/version)"
              echo "ready: ${version}"
              echo "Shard ${KYU_INTEGRATION_SHARD}: engine ${ENGINE_TAG}, reports ${version}" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep 2
          done
          echo "hatchet-lite ${ENGINE_TAG} never became ready" >&2
          docker logs "${{ job.services.hatchet-lite.id }}" | tail -50
          exit 1
      - name: Mint a worker token
        run: |
          TOKEN="$(docker exec "${{ job.services.hatchet-lite.id }}" /hatchet-admin token create --config /config --tenant-id 707d0855-80ab-4e1f-a156-f1c4546cbf52 | tr -d '\r\n')"
          echo "::add-mask::${TOKEN}"
          echo "HATCHET_CLIENT_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          echo "HATCHET_CLIENT_TLS_STRATEGY=none" >> "$GITHUB_ENV"
      - run: pnpm --filter @kyuworks/sdk test:integration
