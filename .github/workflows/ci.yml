name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Build first: type-aware oxlint needs @kyuworks/schemas's dist so packages/sdk resolves real types, not `any`.
      - uses: ./.github/actions/setup
        with:
          build: 'true'
      - name: Format
        run: pnpm format:check
      - name: Gates
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${GITHUB_BASE_SHA}" ]; then
            bash scripts/verify-gates.sh --range "${GITHUB_BASE_SHA}...HEAD"
          else
            bash scripts/verify-gates.sh --range "$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)...HEAD"
          fi
      - name: Lint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          build: 'false'
      - run: pnpm typecheck
      - run: pnpm typecheck:tests

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          build: 'false'
      - run: pnpm test

  # Each integration suite runs as two shards, each on its own runner and engine.
  # The shard-one file list is in the suite's vitest.integration.config.ts.
  test-integration-sdk-1:
    name: Integration Tests (1/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KYU_TEST_DATABASE_URL: postgresql://hatchet:hatchet@localhost:5432/kyu_test
      KYU_TEST_POOLER_DATABASE_URL: postgresql://hatchet:hatchet@127.0.0.1:6432/kyu_test
      KYU_INTEGRATION_SHARD: '1'
    # newest-client.yml and newest-engine.yml copy these services; change all three workflows together.
    services: &engine-services
      postgres:
        image: postgres:15.6
        env:
          POSTGRES_USER: hatchet
          POSTGRES_PASSWORD: hatchet
          POSTGRES_DB: hatchet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d hatchet -U hatchet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      hatchet-lite:
        image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.107.0
        env:
          DATABASE_URL: postgresql://hatchet:hatchet@postgres:5432/hatchet?sslmode=disable
          SERVER_AUTH_COOKIE_DOMAIN: localhost
          SERVER_AUTH_COOKIE_INSECURE: 't'
          SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
          SERVER_GRPC_INSECURE: 't'
          SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
          SERVER_GRPC_PORT: '7077'
          SERVER_URL: http://localhost:8888
          SERVER_AUTH_SET_EMAIL_VERIFIED: 't'
          SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
        ports:
          - 8888:8888
          - 7077:7077
      # Same tag and settings as infra/hatchet/compose.yaml; only shard 2 runs the pooler file.
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DB_HOST: postgres
          DB_USER: hatchet
          DB_PASSWORD: hatchet
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          LISTEN_PORT: '6432'
          MAX_PREPARED_STATEMENTS: '0'
          SERVER_IDLE_TIMEOUT: '10'
        ports:
          - 6432:6432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 6432 -U hatchet -d hatchet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps: &sdk-integration-steps
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          build: 'true'
      - name: Wait for the engine
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8888/api/ready >/dev/null 2>&1; then echo "ready: $(curl -fsS --max-time 5 http://localhost:8888/api/v1/version)"; exit 0; fi
            sleep 2
          done
          echo "hatchet-lite never became ready" >&2
          docker logs "${{ job.services.hatchet-lite.id }}" | tail -50
          exit 1
      - name: Mint a worker token
        run: |
          TOKEN="$(docker exec "${{ job.services.hatchet-lite.id }}" /hatchet-admin token create --config /config --tenant-id 707d0855-80ab-4e1f-a156-f1c4546cbf52 | tr -d '\r\n')"
          echo "::add-mask::${TOKEN}"
          echo "HATCHET_CLIENT_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          echo "HATCHET_CLIENT_TLS_STRATEGY=none" >> "$GITHUB_ENV"
      - run: pnpm --filter @kyuworks/sdk test:integration

  test-integration-sdk-2:
    name: Integration Tests (2/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KYU_TEST_DATABASE_URL: postgresql://hatchet:hatchet@localhost:5432/kyu_test
      KYU_TEST_POOLER_DATABASE_URL: postgresql://hatchet:hatchet@127.0.0.1:6432/kyu_test
      KYU_INTEGRATION_SHARD: '2'
    services: *engine-services
    steps: *sdk-integration-steps

  self-tests:
    name: Gate Self Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          build: 'false'
      - run: bash scripts/verify-self-tests.sh

  build:
    name: Build
    needs: [lint, typecheck, test-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          build: 'true'
