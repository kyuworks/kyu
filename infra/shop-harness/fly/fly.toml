# Fly config for the shop failure harness, run in-region against the
# deployed dev engine <engine-app> (issue #166). One machine, started for
# a run and stopped when run.sh exits: this file declares no services block,
# so fly-proxy has nothing to autostart it on, and the restart policy below
# is 'never', which leaves it `stopped` rather than restarting CMD. Full
# runbook: docs/operations/kyu-engine-on-fly.md
primary_region = 'syd'

[[restart]]
  policy = 'never'

[[vm]]
  # One machine runs the harness, the relay and the worker at once; shared
  # CPU would throttle under load and corrupt the latency numbers this lane
  # exists to measure.
  size = 'performance-2x'

[env]
  # HATCHET_CLIENT_HOST_PORT and HATCHET_CLIENT_API_URL are secrets (secrets.sh):
  # <engine-app>.internal:7077 and http://<engine-app>.internal:8888. Plaintext
  # on 6PN: <engine-app> sets SERVER_GRPC_INSECURE and there is no edge to terminate TLS.
  # Fallback (public edge, same as the laptop-to-Fly run): see "Network path
  # and its fallback" in docs/operations/kyu-engine-on-fly.md.
  HATCHET_CLIENT_TLS_STRATEGY = 'none'
  KYU_SHOP_NAMESPACE = 'inregion166_'
  KYU_SHOP_SLOTS = '50'
  KYU_SHOP_DURABLE_SLOTS = '200'
  KYU_SHOP_WATCH_TIMEOUT = '1s'
  KYU_HARNESS_SCENARIOS = 'tenant-load outbox-backlog'
  KYU_HARNESS_SIZE = 'report'
  KYU_HARNESS_HOLD_SECONDS = '900'
