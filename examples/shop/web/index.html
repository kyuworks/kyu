<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Empty data uri: stops a browser's automatic /favicon.ico request from landing in the 404 path. -->
    <link rel="icon" href="data:," />
    <title>Kyu shop</title>
    <!-- Sets the dark class before first paint, so the page never flashes light then dark.
         web/lib/theme.ts keeps it in sync after mount; try/catch mirrors that guard. -->
    <script>
      try {
        document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
